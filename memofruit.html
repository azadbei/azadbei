<!DOCTYPE html>
<html lang="uz" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meva xotira o'yini</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 30%, #1a1a3e, #0a0a1a);
            padding: 16px;
            margin: 0;
        }

        /* ===== CONTAINER ===== */
        .game-wrapper {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 22px 22px 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            max-width: 680px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 18px 4px;
            flex-wrap: wrap;
            gap: 10px 16px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .title span {
            background: linear-gradient(135deg, #f472b6, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
        }

        .stats .label {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        .stats .value {
            color: #fff;
            font-weight: 700;
            min-width: 26px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .stats .value.time {
            min-width: 40px;
        }

        .stat-divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== BOARD ===== */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 4px;
            margin: 2px 0 4px;
        }

        /* ===== CARD ===== */
        .card {
            aspect-ratio: 1 / 1;
            perspective: 800px;
            cursor: pointer;
            user-select: none;
            border-radius: 16px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-front {
            border: 4px solid #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2), 0 8px 28px rgba(34, 197, 94, 0.25);
            background: rgba(34, 197, 94, 0.15);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .card-back {
            background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transform: rotateY(0deg);
            background-image: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
        }

        .card-back::after {
            content: "?";
            font-size: 34px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.08);
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.1);
            letter-spacing: 2px;
        }

        .card-back .pattern {
            position: absolute;
            inset: 10px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 8px,
                    rgba(255, 255, 255, 0.01) 8px,
                    rgba(255, 255, 255, 0.01) 9px);
        }

        .card-front {
            background: linear-gradient(145deg, #1e1e44, #12122a);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transform: rotateY(180deg);
            font-size: 44px;
            color: #fff;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.3);
            background-image: radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.05) 0%, transparent 70%);
        }

        .card-front .emoji {
            line-height: 1;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s ease;
            font-size: 44px;
        }

        .card:not(.flipped):not(.matched):hover .card-front .emoji {
            transform: scale(1.1);
        }

        .card:not(.flipped):not(.matched):hover .card-inner {
            transform: scale(1.02);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
        }

        /* ===== BOTTOM ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 4px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
            padding: 6px 14px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 32px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.45);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* ===== WIN OVERLAY ===== */
        .win-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease;
            padding: 24px;
        }

        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-card {
            background: linear-gradient(145deg, #1e1e44, #0f0f28);
            border-radius: 48px;
            padding: 40px 44px 46px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
            opacity: 0;
        }

        .win-overlay.show .win-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .win-card .trophy {
            font-size: 60px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.3));
        }

        .win-card h2 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fbbf24, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .win-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin: 6px 0 22px;
            line-height: 1.5;
        }

        .win-card .stats-final {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 12px 0 24px;
        }

        .win-card .stats-final div {
            text-align: center;
        }

        .win-card .stats-final .num {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            display: block;
        }

        .win-card .stats-final .lbl {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 400;
            margin-top: 4px;
        }

        .win-card .btn {
            margin: 0 auto;
            font-size: 16px;
            padding: 12px 36px;
        }

        @keyframes shakeWrong {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            25% { transform: rotateY(180deg) translateX(-6px); }
            75% { transform: rotateY(180deg) translateX(6px); }
        }

        .card.wrong .card-inner {
            animation: shakeWrong 0.35s ease;
        }

        .card.wrong .card-front {
            border-color: rgba(244, 67, 54, 0.5);
            box-shadow: 0 0 30px rgba(244, 67, 54, 0.12);
        }
    </style>
</head>
<body>

    <!-- ===== GAME WRAPPER ===== -->
    <div class="game-wrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="title">
                <span>Meva xotira o'yini</span>
            </div>

            <div class="stats">
                <span>
                    <span class="label">Urinish</span>
                    <span class="value" id="attempts">0</span>
                </span>

                <span class="stat-divider"></span>

                <span>
                    <span class="label">Mos kelish</span>
                    <span class="value" id="matches">0</span>
                    <span style="color:rgba(255,255,255,0.2);">/ 8</span>
                </span>

                <span class="stat-divider"></span>

                <span>
                    <span class="label">⏱️</span>
                    <span class="value time" id="timer">00</span>
                </span>
            </div>
        </div>

        <!-- BOARD -->
        <div class="board" id="board"></div>

        <!-- FOOTER -->
        <div class="footer">
            <div class="message" id="message">
                Kartalarni aylantiring va o'xshash juftliklarni toping!
            </div>

            <div class="actions">
                <button class="btn" id="resetBtn">Yangi o'yin</button>
            </div>
        </div>
    </div>

    <!-- ===== WIN OVERLAY ===== -->
    <div class="win-overlay" id="winOverlay">
        <div class="win-card">
            <span class="trophy">🏆</span>
            <h2>Tabriklayman! Siz yutdingiz!</h2>

            <p>
                Barcha juftliklarni
                <span id="winAttempts" style="color:#a78bfa;font-weight:600;"></span>
                ta urinishda topdingiz.
            </p>

            <div class="stats-final">
                <div>
                    <span class="num" id="winTime">00</span>
                    <span class="lbl">Vaqt (sekund)</span>
                </div>

                <div>
                    <span class="num" id="winAttemptsNum">0</span>
                    <span class="lbl">Urinishlar soni</span>
                </div>
            </div>

            <button class="btn" id="playAgainBtn">Yana o'ynash</button>
        </div>
    </div>

    <script>
        const FRUITS = [
            { emoji: '🍎', name: 'Olma' },
            { emoji: '🍌', name: 'Banan' },
            { emoji: '🍇', name: 'Uzum' },
            { emoji: '🍓', name: 'Qulupnay' },
            { emoji: '🍉', name: 'Tarvuz' },
            { emoji: '🍑', name: 'Shaftoli' },
            { emoji: '🍋', name: 'Limon' },
            { emoji: '🍒', name: 'Gilos' }
        ];

        const TOTAL_PAIRS = FRUITS.length;
        const TOTAL_CARDS = TOTAL_PAIRS * 2;

        const board = document.getElementById('board');
        const attemptsEl = document.getElementById('attempts');
        const matchesEl = document.getElementById('matches');
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');
        const winOverlay = document.getElementById('winOverlay');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const winAttempts = document.getElementById('winAttempts');
        const winAttemptsNum = document.getElementById('winAttemptsNum');
        const winTime = document.getElementById('winTime');

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let attempts = 0;
        let isLocked = false;
        let timerInterval = null;
        let seconds = 0;
        let gameStarted = false;
        let timeoutId = null;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function formatTime(sec) {
            return String(sec).padStart(2, '0');
        }

        function buildCardData() {
            const deck = [];
            for (let i = 0; i < TOTAL_PAIRS; i++) {
                deck.push({ id: i, emoji: FRUITS[i].emoji, name: FRUITS[i].name, matched: false, flipped: false });
                deck.push({ id: i, emoji: FRUITS[i].emoji, name: FRUITS[i].name, matched: false, flipped: false });
            }
            return shuffle(deck);
        }

        function renderBoard() {
            board.innerHTML = '';
            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.index = index;

                const inner = document.createElement('div');
                inner.className = 'card-inner';

                const back = document.createElement('div');
                back.className = 'card-face card-back';
                const pattern = document.createElement('div');
                pattern.className = 'pattern';
                back.appendChild(pattern);

                const front = document.createElement('div');
                front.className = 'card-face card-front';
                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'emoji';
                emojiSpan.textContent = card.emoji;
                front.appendChild(emojiSpan);

                inner.appendChild(back);
                inner.appendChild(front);
                cardEl.appendChild(inner);

                cardEl.addEventListener('click', () => onCardClick(index));

                board.appendChild(cardEl);
                card.element = cardEl;
            });
        }

        function updateStats() {
            attemptsEl.textContent = attempts;
            matchesEl.textContent = matchedPairs;
        }

        function updateTimer() {
            timerEl.textContent = formatTime(seconds);
        }

        function setMessage(text, isSuccess = false, isError = false) {
            messageEl.innerHTML = text;
            messageEl.style.borderColor = isSuccess ? 'rgba(34,197,94,0.3)' :
                isError ? 'rgba(244,67,54,0.2)' : 'rgba(255,255,255,0.04)';
            messageEl.style.background = isSuccess ? 'rgba(34,197,94,0.08)' :
                isError ? 'rgba(244,67,54,0.06)' : 'rgba(0,0,0,0.2)';
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                seconds++;
                updateTimer();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            stopTimer();
            seconds = 0;
            gameStarted = false;
            updateTimer();
        }

        function onCardClick(index) {
            if (isLocked) return;
            const card = cards[index];
            const el = card.element;

            if (card.matched || card.flipped) return;

            if (!gameStarted && flippedCards.length === 0) {
                startTimer();
            }

            card.flipped = true;
            el.classList.add('flipped');
            flippedCards.push(index);

            if (flippedCards.length === 2) {
                isLocked = true;
                attempts++;
                updateStats();

                const idx1 = flippedCards[0];
                const idx2 = flippedCards[1];
                const card1 = cards[idx1];
                const card2 = cards[idx2];
                const el1 = card1.element;
                const el2 = card2.element;

                if (card1.id === card2.id && idx1 !== idx2) {
                    card1.matched = true;
                    card2.matched = true;
                    card1.flipped = true;
                    card2.flipped = true;
                    matchedPairs++;
                    updateStats();

                    el1.classList.add('matched');
                    el2.classList.add('matched');

                    setMessage(`Juftlik topildi! (${card1.emoji} ${card1.name})`, true);

                    flippedCards = [];
                    isLocked = false;

                    if (matchedPairs === TOTAL_PAIRS) {
                        handleWin();
                    }
                } else {
                    setMessage(`Bu juftlik emas! Yana bir urinish qiling`, false, true);

                    el1.classList.add('wrong');
                    el2.classList.add('wrong');

                    timeoutId = setTimeout(() => {
                        if (!card1.matched) {
                            card1.flipped = false;
                            el1.classList.remove('flipped', 'wrong');
                        }
                        if (!card2.matched) {
                            card2.flipped = false;
                            el2.classList.remove('flipped', 'wrong');
                        }
                        flippedCards = [];
                        isLocked = false;
                        setMessage('Kartalarni aylantiring va o\'xshash juftliklarni toping');
                        timeoutId = null;
                    }, 700);
                }
            } else {
                setMessage(`Ikkinchi kartani tanlang...`);
            }
        }

        function handleWin() {
            stopTimer();
            winAttempts.textContent = attempts;
            winAttemptsNum.textContent = attempts;
            winTime.textContent = seconds;
            setMessage(`🎉 Tabriklayman! Barcha juftliklarni topdingiz!`, true);

            setTimeout(() => {
                winOverlay.classList.add('show');
            }, 400);
        }

        function resetGame() {
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }

            stopTimer();
            resetTimer();

            cards = buildCardData();
            flippedCards = [];
            matchedPairs = 0;
            attempts = 0;
            isLocked = false;
            gameStarted = false;
            seconds = 0;

            renderBoard();
            updateStats();
            updateTimer();
            setMessage("Yangi o'yin boshlandi! Omad tilaymiz!");
            winOverlay.classList.remove('show');
        }

        function initGame() {
            cards = buildCardData();
            renderBoard();
            updateStats();
            updateTimer();
            setMessage("Kartalarni aylantiring va o'xshash juftliklarni toping!");
            winOverlay.classList.remove('show');
            resetTimer();
            flippedCards = [];
            matchedPairs = 0;
            attempts = 0;
            isLocked = false;
            gameStarted = false;
        }

        resetBtn.addEventListener('click', resetGame);
        playAgainBtn.addEventListener('click', resetGame);

        initGame();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (!e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    resetGame();
                }
            }
            if (e.key === 'Enter' && winOverlay.classList.contains('show')) {
                resetGame();
            }
        });
    </script>
</body>
</html>

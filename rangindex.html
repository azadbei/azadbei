<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Impulse Rule Breaker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      height: 90vh;
      max-height: 750px;
      background: #1e293b;
      border-radius: 32px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }

    .lives {
      color: #ef4444;
      letter-spacing: 2px;
    }

    .timer-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 12px;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #38bdf8;
      transition: width 0.05s linear;
    }

    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .rule-box {
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      text-align: center;
      transition: all 0.2s ease;
    }

    .rule-reverse {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.15);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .orb:active {
      transform: scale(0.96);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .btn-color {
      height: 70px;
      border-radius: 20px;
      border: none;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .btn-color:active {
      transform: scale(0.94);
      filter: brightness(1.2);
    }

    .btn-red { background: #ef4444; }
    .btn-blue { background: #3b82f6; }
    .btn-green { background: #10b981; }
    .btn-yellow { background: #f59e0b; }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      z-index: 10;
    }

    .modal h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .modal p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-start {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 36px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <div class="top-bar">
        <div class="stat-badge">BALL: <span id="score">0</span></div>
        <div class="stat-badge lives" id="lives">❤️❤️❤️</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-bar" id="timerBar"></div>
      </div>
    </div>

    <div class="center-stage">
      <div class="rule-box" id="ruleText">MOSINI BOS!</div>
      <div class="orb" id="orb"></div>
    </div>

    <div class="action-grid">
      <button class="btn-color btn-red" onclick="handleTap('red')">Qizil</button>
      <button class="btn-color btn-blue" onclick="handleTap('blue')">Ko‘k</button>
      <button class="btn-color btn-green" onclick="handleTap('green')">Yashil</button>
      <button class="btn-color btn-yellow" onclick="handleTap('yellow')">Sariq</button>
    </div>

    <div class="modal" id="modal">
      <h1 id="modalTitle">IMPULSE</h1>
      <p id="modalDesc">
        <strong>Oddiy qoida:</strong> Doira rangiga mos tugmani bosing.<br><br>
        <strong>Qoidabuzar:</strong> Agar qizil ogohlantirish chiqsa, doiraning rangidan <em>boshqa</em> ixtiyoriy rangni bosing!
      </p>
      <button class="btn-start" id="startBtn" onclick="startGame()">BOSHLASH</button>
    </div>
  </div>

  <script>
    const COLORS = [
      { id: 'red', hex: '#ef4444' },
      { id: 'blue', hex: '#3b82f6' },
      { id: 'green', hex: '#10b981' },
      { id: 'yellow', hex: '#f59e0b' }
    ];

    let score = 0;
    let lives = 3;
    let currentColor = null;
    let isReversed = false;
    let timerInterval = null;
    let timeLimit = 1500;
    let timeRemaining = 1500;

    const orb = document.getElementById('orb');
    const ruleText = document.getElementById('ruleText');
    const scoreDisplay = document.getElementById('score');
    const livesDisplay = document.getElementById('lives');
    const timerBar = document.getElementById('timerBar');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const startBtn = document.getElementById('startBtn');

    function startGame() {
      score = 0;
      lives = 3;
      timeLimit = 1500;
      updateHeader();
      modal.classList.add('hidden');
      nextRound();
    }

    function updateHeader() {
      scoreDisplay.textContent = score;
      livesDisplay.textContent = '❤️'.repeat(lives);
    }

    function nextRound() {
      clearInterval(timerInterval);
      timeRemaining = Math.max(700, 1500 - (score * 25));

      isReversed = Math.random() < 0.35 && score >= 3;
      currentColor = COLORS[Math.floor(Math.random() * COLORS.length)];

      orb.style.backgroundColor = currentColor.hex;

      if (isReversed) {
        ruleText.textContent = "BOSHQASINI BOS! ⚡";
        ruleText.classList.add('rule-reverse');
      } else {
        ruleText.textContent = "MOSINI BOS";
        ruleText.classList.remove('rule-reverse');
      }

      startTimer();
    }

    function startTimer() {
      const startTime = Date.now();
      const initialLimit = timeRemaining;

      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const left = initialLimit - elapsed;
        const percent = Math.max(0, (left / initialLimit) * 100);
        timerBar.style.width = percent + '%';

        if (left <= 0) {
          clearInterval(timerInterval);
          penalize();
        }
      }, 20);
    }

    function handleTap(colorId) {
      clearInterval(timerInterval);

      let isCorrect = false;
      if (!isReversed) {
        isCorrect = (colorId === currentColor.id);
      } else {
        isCorrect = (colorId !== currentColor.id);
      }

      if (isCorrect) {
        score++;
        updateHeader();
        nextRound();
      } else {
        penalize();
      }
    }

    function penalize() {
      lives--;
      updateHeader();
      
      if (navigator.vibrate) navigator.vibrate(200);

      if (lives <= 0) {
        gameOver();
      } else {
        nextRound();
      }
    }

    function gameOver() {
      clearInterval(timerInterval);
      modalTitle.textContent = "O‘YIN TUGADI!";
      document.getElementById('modalDesc').innerHTML = `To‘plagan balingiz: <strong>${score}</strong><br>Yana urinib ko‘rasizmi?`;
      startBtn.textContent = "QAYTA BOSHLASH";
      modal.classList.remove('hidden');
    }
  </script>
</body>
</html>
